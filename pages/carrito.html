<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TorqueX - Carrito de compras</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <h2>Tu carrito de compras</h2>

      <div id="carrito-vacio" style="display: none;">
        <p>Tu carrito está vacío.</p>
        <a href="./motor.html" class="btn-comprar">Seguir comprando</a>
      </div>

      <div id="carrito-contenido">
        <table class="tabla-carrito">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio unitario</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="lista-carrito"></tbody>
        </table>

        <div class="resumen-carrito">
          <h3>Total: <span id="total-carrito">$0</span></h3>
          <button type="button" id="btnVaciarCarrito" class="btn-vaciar">
            Vaciar carrito
          </button>
          <a href="./index.html" class="btn-seguir">Volver al inicio</a>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 TorqueX - Repuestos y accesorios para vehículos</p>
      <p>Todos los derechos reservados.</p>
    </footer>

    <script src="../js/navbar.js"></script>
    <script src="../js/cards.js"></script>
    <script src="../js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/carrito.js"></script>
  </body>
</html>
